<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="chat-shell">

    <!-- HEADER -->
    <header class="chat-header">
      <div class="agent-identity">
        <span class="agent-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="currentColor"/>
          </svg>
        </span>
        <div>
          <p class="agent-name">Assistente Virtuale</p>
          <p class="agent-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusLabel">Connessione in corso…</span>
          </p>
        </div>
      </div>
      <button class="btn-icon" id="btnReset" title="Nuova conversazione" aria-label="Nuova conversazione">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <!-- MESSAGES -->
    <main class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Conversazione">
      <!-- I messaggi vengono inseriti via JS -->
    </main>

    <!-- TYPING INDICATOR (hidden by default) -->
    <div class="typing-indicator" id="typingIndicator" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <!-- INPUT AREA -->
    <footer class="chat-input-area">
      <div class="input-wrapper">
        <textarea
          id="userInput"
          placeholder="Scrivi un messaggio…"
          rows="1"
          maxlength="2000"
          aria-label="Messaggio"
          disabled
        ></textarea>
        <button class="btn-send" id="btnSend" aria-label="Invia messaggio" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">Premi <kbd>Enter</kbd> per inviare · <kbd>Shift+Enter</kbd> per andare a capo</p>
    </footer>

  </div>

  <script src="config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
